<script>
const $=(s,p=document)=>p.querySelector(s);const $$=(s,p=document)=>[...p.querySelectorAll(s)];
const state={menu:0,lang:'en',search:'',activeCat:null};
const ui={en:{search:'Search dishes, drinks, desserts…',discover:'Discover',popular:'Chocoberry favourites',items:'items',menu:'Menu',searchNav:'Search',info:'Contact us',bestseller:'Popular',new:'New',from:'from',allergens:'Allergens',hours:'Opening hours',locations:'Location',contact:'Contact',visit:'Visit website',instagram:'Instagram',no:'No matches',try:'Try another search or category.',cake:'Cakes',downtown:'Dubai',sharjah:'Sharjah'},ar:{search:'ابحث عن الأطباق والمشروبات والحلويات…',discover:'اكتشف',popular:'اختيارات شوكوبيري',items:'صنف',menu:'القائمة',searchNav:'بحث',info:'تواصل معنا',bestseller:'الأكثر طلباً',new:'جديد',from:'من',allergens:'مسببات الحساسية',hours:'ساعات العمل',locations:'الموقع',contact:'تواصل',visit:'الموقع',instagram:'إنستغرام',no:'لا توجد نتائج',try:'جرّب بحثاً أو قسماً آخر.',cake:'كيك',downtown:'دبي',sharjah:'الشارقة'}};
function t(k){return ui[state.lang][k]||k}function txt(o){return (o&&((o[state.lang]||o.en||o.ar)))||''}function money(n){if(n===null||n===undefined||n==='')return'';return `${DATA.restaurant.currency} ${Number(n).toFixed(Number(n)%1?2:0)}`}
function price(p){const v=p.variants||[];if(!v.length)return'';const nums=v.map(x=>Number(x.price)).filter(Number.isFinite);if(!nums.length)return'';const min=Math.min(...nums),max=Math.max(...nums);return min===max?money(min):`${t('from')} ${money(min)}`}
function locMeta(){return 'Dubai Downtown · 8:00 AM–1:30 AM'}
function heroProduct(menu){let p=null;for(const c of menu.categories){p=c.products.find(x=>x.bestseller)||p;if(p)break}return p||menu.categories.flatMap(c=>c.products).find(x=>x.image)}
function filteredCategories(menu){const q=state.search.trim().toLowerCase();if(!q)return menu.categories;return menu.categories.map(c=>({...c,products:c.products.filter(p=>`${txt(p.name)} ${txt(p.description)} ${p.name.en} ${p.name.ar}`.toLowerCase().includes(q))})).filter(c=>c.products.length)}
function render(){document.documentElement.lang=state.lang;document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';const menu=DATA.menus[0];const cats=filteredCategories(menu);const hp=heroProduct(menu);const featured=menu.categories.flatMap(c=>c.products).filter(p=>p.bestseller||p.new).slice(0,7);const total=menu.categories.reduce((n,c)=>n+c.products.length,0);
$('#app').innerHTML=`

<div class="search-wrap"><label class="search">⌕<input id="searchInput" value="${state.search.replace(/"/g,'&quot;')}" placeholder="${t('search')}" autocomplete="off"><button class="clear" id="clearBtn" aria-label="Clear">×</button></label></div>
<div class="categories-wrap"><div class="categories" id="categories">${menu.categories.map((c,i)=>`<button class="chip ${i===0?'active':''}" data-cat="cat-${c.id}">${txt(c.name)}</button>`).join('')}</div></div>
<main>${!state.search?`<section class="hero">${hp&&hp.imageFull?`<img class="hero-img" src="${hp.imageFull}" alt="">`:''}<div class="hero-orb orb-one"></div><div class="hero-orb orb-two"></div><div class="hero-copy"><div class="eyebrow">✦ ${t('discover')}</div><span class="hero-kicker">${state.lang==='en'?'BRUNCH · COFFEE · DESSERT':'فطور · قهوة · حلويات'}</span><h1>${state.lang==='en'?'Made for slow mornings & sweet endings':'لصباحات هادئة ونهايات حلوة'}</h1><p>${state.lang==='en'?DATA.restaurant.description:'إفطار طوال اليوم، قهوة وحلويات في شوكوبيري لندن.'}</p><div class="hero-meta"><span class="pill">${locMeta()}</span><span class="pill">${total} ${t('items')}</span></div></div><div class="hero-stamp"><span>CB</span><small>${state.lang==='en'?'DUBAI':'دبي'}</small></div></section><div class="mood-strip" aria-hidden="true"><div><span>✦</span>${state.lang==='en'?'ALL DAY BREAKFAST':'فطور طوال اليوم'}</div><div><span>✦</span>${state.lang==='en'?'SIGNATURE SWEETS':'حلويات مميزة'}</div><div><span>✦</span>${state.lang==='en'?'SPECIALTY COFFEE':'قهوة مختصة'}</div><div><span>✦</span>${state.lang==='en'?'MATCHA MOMENTS':'لحظات الماتشا'}</div></div>`:''}
${!state.search&&featured.length?`<section class="section featured-section"><div class="section-title-row"><div><h2 class="section-title">${t('popular')}</h2><p class="section-sub">${state.lang==='en'?'A visual shortcut to crowd favourites.':'اختيارات مفضلة وسريعة.'}</p></div></div><div class="featured">${featured.map(p=>featureCard(p)).join('')}</div></section>`:''}
<div id="menuContent">${cats.length?cats.map(cat=>categoryHTML(cat)).join(''):`<div class="empty"><strong>${t('no')}</strong>${t('try')}</div>`}</div>${!state.search?`<footer class="menu-footer"><span class="footer-mark">CB</span><p>${state.lang==='en'?'Save room for something sweet.':'خلّي مكان للحلو.'}</p><small>${state.lang==='en'?'Chocoberry London · Downtown Dubai':'شوكوبيري لندن · وسط مدينة دبي'}</small></footer>`:''}</main>
<nav class="bottom-nav"><button class="active" id="navMenu"><span>☰</span>${t('menu')}</button><button id="navInfo"><span>✉</span>${t('info')}</button></nav>`;

function featureCard(p){return `<button class="feature-card" data-product="${p.id}"><div class="feature-media">${p.image?`<img loading="lazy" src="${p.imageFull||p.image}" alt="${txt(p.name).replace(/"/g,'&quot;')}">`:''}<span class="feature-badge">${p.new?t('new'):t('bestseller')}</span></div><div class="feature-body"><div class="feature-name">${txt(p.name)}</div><div class="feature-price">${price(p)}</div></div></button>`}
function catIcon(name){const n=(name||'').toLowerCase();if(n.includes('pastr')||n.includes('bakery'))return '✣';if(n.includes('breakfast'))return '☀';if(n.includes('sandwich'))return '◇';if(n.includes('soup'))return '◒';if(n.includes('salad'))return '❋';if(n.includes('bowl'))return '◉';if(n.includes('main'))return '✦';if(n.includes('kids'))return '☺';if(n.includes('treat'))return '♥';if(n.includes('matcha'))return '◌';if(n.includes('coffee'))return '☕';if(n.includes('tea'))return '♨';if(n.includes('mocktail')||n.includes('smooth')||n.includes('juice'))return '◍';return '✧'}
function categoryHTML(cat){const idx=DATA.menus[0].categories.findIndex(c=>c.id===cat.id)+1;return `<section class="category-section" id="cat-${cat.id}"><div class="cat-heading"><div class="cat-title-pack"><span class="cat-icon">${catIcon(cat.name.en)}</span><div><span class="cat-index">${String(idx).padStart(2,'0')}</span><h2>${txt(cat.name)}</h2></div></div><span class="cat-count">${cat.products.length} ${t('items')}</span></div><div class="product-list">${cat.products.map(productHTML).join('')}</div></section>`}
function productHTML(p){return `<button class="product" data-product="${p.id}"><div class="product-info"><div class="product-top"><span class="product-name">${txt(p.name)}</span>${p.bestseller?`<span class="tag">${t('bestseller')}</span>`:''}${p.new?`<span class="tag new">${t('new')}</span>`:''}</div>${txt(p.description)?`<div class="product-desc">${txt(p.description)}</div>`:''}<div class="product-price">${price(p)}</div></div><div class="product-media">${p.image?`<img class="product-img" loading="lazy" src="${p.image}" alt="${txt(p.name).replace(/"/g,'&quot;')}">`:`<div class="no-image">✦</div>`}<span class="open-cue" aria-hidden="true">+</span></div></button>`}
function findProduct(id){for(const c of DATA.menus[0].categories){const p=c.products.find(p=>String(p.id)===String(id));if(p)return p}}
function openProduct(p){const vars=p.variants||[];$('#sheet').innerHTML=`<div class="sheet-handle"></div>${p.imageFull?`<img class="detail-img" src="${p.imageFull}" alt="${txt(p.name).replace(/"/g,'&quot;')}">`:''}<div class="detail-content"><div class="detail-top"><h2 class="detail-title">${txt(p.name)}</h2><button class="close">×</button></div>${txt(p.description)?`<p class="detail-desc">${txt(p.description)}</p>`:''}<div>${vars.map(v=>`<div class="variant"><span>${txt(v.name)||txt(p.name)}</span><strong>${money(v.price)}</strong></div>`).join('')}</div>${p.warnings&&p.warnings.length?`<div class="warnings"><span class="warning" style="font-weight:800">${t('allergens')}</span>${p.warnings.map(w=>`<span class="warning">${txt(w)}</span>`).join('')}</div>`:''}</div>`;showSheet()}
function openInfo(){const addr='Chocoberry, Boulevard Central Tower 1 - Sheikh Mohammed bin Rashid Blvd - Downtown - Dubai';const hours='Dubai Downtown - 8:00 AM to 1:30 AM';$('#sheet').innerHTML=`<div class="sheet-handle"></div><div class="detail-content"><div class="detail-top"><h2 class="detail-title">${DATA.restaurant.name}</h2><button class="close">×</button></div></div><div class="info-block"><div class="info-card"><b>${t('hours')}</b><p>${hours}</p></div><div class="info-card"><b>${t('locations')}</b><p>${addr}</p></div><div class="links">${DATA.restaurant.website?`<a href="${DATA.restaurant.website}" target="_blank">${t('visit')}</a>`:''}${DATA.restaurant.instagram?`<a class="alt" href="${DATA.restaurant.instagram}" target="_blank">${t('instagram')}</a>`:''}</div></div>`;showSheet()}
function showSheet(){$('#sheet').classList.add('show');$('#backdrop').classList.add('show');document.body.style.overflow='hidden';$('.close',$('#sheet'))?.addEventListener('click',closeSheet)}function closeSheet(){$('#sheet').classList.remove('show');$('#backdrop').classList.remove('show');document.body.style.overflow=''}
let searchTimer;function bind(){$('#langBtn').onclick=()=>{state.lang=state.lang==='en'?'ar':'en';render()};const inp=$('#searchInput');const clear=$('#clearBtn');if(state.search)clear.style.display='block';inp.oninput=e=>{state.search=e.target.value;clear.style.display=state.search?'block':'none';clearTimeout(searchTimer);searchTimer=setTimeout(()=>{render();requestAnimationFrame(()=>{const n=$('#searchInput');if(n){n.focus();const k=n.value.length;n.setSelectionRange(k,k)}})},180)};clear.onclick=()=>{state.search='';render();setTimeout(()=>$('#searchInput')?.focus(),0)};$$('.chip').forEach(b=>b.onclick=()=>{const el=document.getElementById(b.dataset.cat);el?.scrollIntoView({behavior:'smooth',block:'start'})});$$('[data-product]').forEach(b=>b.onclick=()=>openProduct(findProduct(b.dataset.product)));$('#navSearch')?.addEventListener('click',()=>{window.scrollTo({top:70,behavior:'smooth'});setTimeout(()=>$('#searchInput')?.focus(),350)});$('#navInfo')?.addEventListener('click',openInfo);$('#navMenu')?.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));$('#backdrop').onclick=closeSheet}
let observer;function setupObserver(){if(observer)observer.disconnect();const sections=$$('.category-section');observer=new IntersectionObserver(es=>{const visible=es.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(!visible)return;const id=visible.target.id;$$('.chip').forEach(c=>c.classList.toggle('active',c.dataset.cat===id));const active=$(`.chip[data-cat="${id}"]`);active?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})},{rootMargin:'-138px 0px -60% 0px',threshold:[0,.1,.3]});sections.forEach(s=>observer.observe(s))}

function updateScrollProgress(){const el=document.getElementById('scrollProgress');if(!el)return;const max=document.documentElement.scrollHeight-innerHeight;el.style.transform=`scaleX(${max>0?Math.min(1,scrollY/max):0})`}
window.addEventListener('scroll',updateScrollProgress,{passive:true});
</script>
